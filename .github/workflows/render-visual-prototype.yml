name: Render Visual Engine Prototype
on:
  workflow_dispatch:
  push:
    branches: [visual-engine-prototype]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev
      - name: Install Manim
        run: python -m pip install --upgrade pip && python -m pip install manim
      - name: Render Manim source
        run: |
          mkdir -p public/manim diagnostics/manim
          manim -qh visual/scene_01.py Scene01 -o scene01.mp4
          test -s media/videos/scene_01/1920p30/scene01.mp4
          cp media/videos/scene_01/1920p30/scene01.mp4 diagnostics/manim/scene01-raw.mp4
          ffprobe -v error -show_streams -show_format media/videos/scene_01/1920p30/scene01.mp4 > diagnostics/manim/raw-ffprobe.txt
      - name: Normalize Manim video for browser playback
        run: |
          ffmpeg -y -i diagnostics/manim/scene01-raw.mp4             -an -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p             -movflags +faststart -r 30 -vf "scale=1080:1920:flags=lanczos,setsar=1"             public/manim/scene01.mp4
          ffprobe -v error -show_streams -show_format public/manim/scene01.mp4 > diagnostics/manim/normalized-ffprobe.txt
          ffmpeg -y -ss 2 -i public/manim/scene01.mp4 -frames:v 1 -update 1 diagnostics/manim/scene01-frame.png
      - name: Upload Manim source diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v8-manim-source-diagnostics
          path: diagnostics/manim
          if-no-files-found: error
      - name: Install Remotion
        run: npm install
      - name: Generate five-second US English voice
        run: |
          mkdir -p public
          python -m pip install piper-tts
          python -m piper.download_voices --data-dir public en_US-lessac-high
          printf '%s\n' "Turn noise into evidence." | python -m piper -m en_US-lessac-high --data-dir public -f raw-voice.wav --length_scale 0.86
          ffmpeg -y -i raw-voice.wav -af "silenceremove=start_periods=1:start_duration=0.04:start_threshold=-42dB:stop_periods=-1:stop_duration=0.08:stop_threshold=-38dB,apad=pad_dur=0.20,atrim=0:5" -ar 22050 -ac 1 public/voice.wav
      - name: Typecheck
        run: npm run check
      - name: Render final five-second MP4
        run: npm run render
      - name: Verify final MP4
        run: |
          test -s out/scene01.mp4
          ffprobe -v error -show_streams -show_format out/scene01.mp4 > diagnostics/final-ffprobe.txt
          ffmpeg -y -ss 2 -i out/scene01.mp4 -frames:v 1 -update 1 diagnostics/final-frame.png
      - name: Upload final MP4 and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v8-final-scene01
          path: |
            out/scene01.mp4
            diagnostics/final-ffprobe.txt
            diagnostics/final-frame.png
          if-no-files-found: error
