name: Source Test
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Zolotube source
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 curl ffmpeg nodejs npm
          mkdir -p work/source
          curl -L --retry 3 --connect-timeout 15 -A "Mozilla/5.0" "https://zolotube.com/watch?v=5p-sq8v3OXw" -o work/source/zolotube.html
          python3 - <<'PY'
          import re, html
          from pathlib import Path
          s=Path("work/source/zolotube.html").read_text(errors="ignore")
          s=html.unescape(s).replace("\\/", "/")
          urls=re.findall(r'https?://[^"\'<> ]+?\.mp4(?:\?[^"\'<> ]*)?', s, re.I)
          print("Zolotube MP4 candidates:", len(urls))
          for u in urls[:20]:
              print(u)
          Path("work/source/zolotube_urls.txt").write_text("\n".join(urls))
          PY
          echo "Testing self-hosted Cobalt gateway first." 
          COBALT_RESPONSE="$(curl -4 -sS --fail-with-body --connect-timeout 30 --max-time 120 \
            -H "Accept: application/json" -H "Content-Type: application/json" -X POST \
            "https://yasser-cobalt-source-v4.onrender.com/" \
            --data "$(python3 - <<'PY'
import json
print(json.dumps({"url":"https://youtu.be/5p-sq8v3OXw?si=TYtkMQ6vzEFNY2Hj","downloadMode":"auto","videoQuality":"720","youtubeVideoCodec":"h264","youtubeVideoContainer":"mp4"}))
PY
)")" || true
          echo "$COBALT_RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$COBALT_RESPONSE"
          COBALT_URL="$(echo "$COBALT_RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("url",""))' 2>/dev/null || true)"
          if [ -n "$COBALT_URL" ]; then
            echo "Self-hosted Cobalt returned a media URL."
            curl -4 -L --fail --show-error --retry 3 --connect-timeout 30 --max-time 900 -A "Mozilla/5.0" "$COBALT_URL" -o work/source/source.mp4
          else
            echo "Self-hosted Cobalt did not return a media URL; continue with mirror inspection."
          fi
          if [ ! -s work/source/source.mp4 ]; then

            echo "No MP4 in raw HTML. Inspecting the rendered page with Chromium."
            npm init -y >/dev/null 2>&1
            npm install --no-audit --no-fund playwright >/dev/null 2>&1
            npx playwright install --with-deps chromium >/dev/null 2>&1
            node scripts/inspect_zolotube.mjs "https://zolotube.com/watch?v=5p-sq8v3OXw" | sed -n '/MP4_CANDIDATES/,/END_MP4_CANDIDATES/p' | sed '1d;$d' > work/source/rendered_mp4_urls.txt
            echo "Rendered MP4 candidates: $(wc -l < work/source/rendered_mp4_urls.txt)"
          fi
          if [ -s work/source/source.mp4 ]; then
            echo "Source acquired through self-hosted Cobalt."
          elif [ -s work/source/zolotube_urls.txt ]; then
            head -n 1 work/source/zolotube_urls.txt | xargs -I{} curl -L --retry 3 --connect-timeout 15 -A "Mozilla/5.0" "{}" -o work/source/source.mp4
          elif [ -s work/source/rendered_mp4_urls.txt ]; then
            head -n 1 work/source/rendered_mp4_urls.txt | xargs -I{} curl -L --retry 3 --connect-timeout 15 -A "Mozilla/5.0" "{}" -o work/source/source.mp4
          else
            echo "Zolotube browser inspection found no direct MP4; testing existing fallback."
            VIDEO_ID=5p-sq8v3OXw python3 scripts/download_youtube_proxy.py
          fi
          file work/source/source.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 work/source/source.mp4
      - name: Upload source test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-test
          path: work/source/
