name: Visual Planner v1

on:
  workflow_dispatch:
  push:
    branches:
      - visual-planner-v1

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck planner only
        run: npx tsc --noEmit --skipLibCheck --strict --target ES2022 --module ESNext --moduleResolution Bundler src/planner/schema.ts src/planner/example-storyboard.ts
