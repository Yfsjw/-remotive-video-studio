name: Render Semantic Shot Planner V2

on:
  workflow_dispatch:
  push:
    branches:
      - visual-shot-planner-v2
  pull_request:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade pip
          python -m pip install piper-tts
          python -m pip install torch torchvision ftfy regex tqdm git+https://github.com/openai/CLIP.git

      - name: Retrieve semantic media
        run: node scripts/retrieve-semantic-media.mjs

      - name: Validate media diversity
        run: |
          test -s public/media-manifest.json
          COUNT=$(node -e "const x=require('./public/media-manifest.json'); console.log(new Set(x.map(v=>v.title)).size)")
          echo "Distinct source videos: $COUNT"
          test "$COUNT" -ge 7
          find public/media -maxdepth 1 -type f -name "*.mp4" -print

      - name: Generate US English narration
        run: |
          mkdir -p public
          python -m piper.download_voices --data-dir public en_US-lessac-high
          printf '%s\n' "Most AI videos explain the idea. They rarely show it. The fix is simple: edit in shots, not slides. Start with the narration. Then ask: what should the viewer actually see? Not a circle. Not a card. A real visual. A change of place can carry a transition. A close-up can make the idea feel concrete. Then cut again before the image becomes wallpaper. Graphics still matter. But they explain what footage cannot. The timeline becomes a sequence of decisions." | python -m piper -m en_US-lessac-high --data-dir public -f narration.wav --length_scale 1.0
          ffmpeg -y -i narration.wav -af "silenceremove=start_periods=1:start_duration=0.05:start_threshold=-42dB:stop_periods=-1:stop_duration=0.12:stop_threshold=-38dB,apad=pad_dur=30,atrim=0:30" -ar 22050 -ac 1 public/voice-shot-test.wav

      - name: Typecheck
        run: npm run check

      - name: Render semantic shot video
        run: npx remotion render src/index.tsx ShotBased out/semantic-shot-planner-v2.mp4 --concurrency=2

      - name: Verify output
        run: |
          test -s out/semantic-shot-planner-v2.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height,r_frame_rate,codec_name -of default=nw=1 out/semantic-shot-planner-v2.mp4

      - name: Upload MP4 and plan
        uses: actions/upload-artifact@v4
        with:
          name: semantic-shot-planner-v2
          path: |
            out/semantic-shot-planner-v2.mp4
            public/media-manifest.json
          if-no-files-found: error
