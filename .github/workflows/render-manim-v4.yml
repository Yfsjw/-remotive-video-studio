name: Render Manim V4 Prototype

on:
  workflow_dispatch:

jobs:
  render-manim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim piper-tts

      - name: Generate voice
        run: |
          mkdir -p public out
          python -m piper.download_voices --data-dir public en_US-lessac-high
          printf '%s\n' "A good prompt starts as a mess. You have a goal, some context, and constraints. The trick is turning those pieces into structure. Once the structure is clear, the same idea can become a research plan, a working draft, and finally a result. The visual should explain the idea, not decorate it." | python -m piper -m en_US-lessac-high --data-dir public -f public/voice.wav --length_scale 0.84
          ffmpeg -y -i public/voice.wav -af "apad=pad_dur=0.5,atrim=0:30" -ar 22050 -ac 1 public/voice-30s.wav

      - name: Render Manim scene
        run: |
          manim -r 1080,1920 --fps 30 --format mp4 -o remotive-v4 manim/main.py RemotiveV4
          VIDEO=$(find media -type f -name 'remotive-v4.mp4' | head -n 1)
          test -n "$VIDEO"
          ffmpeg -y -i "$VIDEO" -i public/voice-30s.wav -map 0:v:0 -map 1:a:0 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest out/remotive-v4-manim.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: remotive-video-studio-manim-v4
          path: out/remotive-v4-manim.mp4
          if-no-files-found: error
