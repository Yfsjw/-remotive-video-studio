name: Render Manim V4.1 Explanatory

on:
  workflow_dispatch:
  push:
    branches:
      - manim-v4-1-explanatory

jobs:
  render-manim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim piper-tts

      - name: Generate voice
        run: |
          mkdir -p public out
          python -m piper.download_voices --data-dir public en_US-lessac-high
          printf '%s\n' "A prompt is not a sentence. It is a system. You start with a goal, context, constraints, and examples. When those pieces connect, the prompt stops being a pile of words and becomes a usable specification. That structure determines what happens next: research, explanation, or building. And the plan can keep transforming until it becomes a real result. The important part is not decoration. Every movement should explain a relationship." | python -m piper -m en_US-lessac-high --data-dir public -f public/voice.wav --length_scale 0.84
          ffmpeg -y -i public/voice.wav -af "apad=whole_dur=30,atrim=0:30" -ar 22050 -ac 1 public/voice-30s.wav

      - name: Render Manim V4.1
        run: |
          manim -r 1080,1920 --fps 30 --format mp4 -o remotive-v4-1 manim/main.py RemotiveV41
          VIDEO=$(find media -type f -name 'remotive-v4-1.mp4' | head -n 1)
          test -n "$VIDEO"
          ffmpeg -y -i "$VIDEO" -i public/voice-30s.wav -map 0:v:0 -map 1:a:0 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest out/remotive-v4-1-manim.mp4

      - name: Validate output duration
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/remotive-v4-1-manim.mp4)
          python -c "d=float('$DURATION'); assert d >= 29.5, f'Video too short: {d:.2f}s'; print(f'Validated duration: {d:.2f}s')"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: remotive-video-studio-manim-v4-1
          path: out/remotive-v4-1-manim.mp4
          if-no-files-found: error
