name: Browser Media Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Authorized YouTube video URL"
        required: true
        default: "https://youtu.be/5p-sq8v3OXw"
        type: string

env:
  YOUTUBE_URL: ${{ inputs.youtube_url || 'https://youtu.be/5p-sq8v3OXw' }}

jobs:
  browser-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium and Node
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium nodejs npm
          node --version
          chromium --version

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright

      - name: Inspect browser playback media
        run: |
          set -o pipefail
          mkdir -p browser-test
          cat > browser-test/inspect.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = process.env.YOUTUBE_URL;
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/chromium',
            args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required']
          });
          const context = await browser.newContext({
            userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
            viewport: { width: 1280, height: 720 }
          });
          const page = await context.newPage();

          const media = new Map();
          page.on('response', async response => {
            const u = response.url();
            const ct = (response.headers()['content-type'] || '').toLowerCase();
            if (u.includes('googlevideo.com') || ct.includes('video/') || ct.includes('mpegurl') || u.includes('.m3u8')) {
              const key = u.split('&range=')[0].slice(0, 1200);
              if (!media.has(key)) {
                media.set(key, {status: response.status(), contentType: ct, url: u.slice(0, 2000)});
              }
            }
          });

          console.log('OPEN', url);
          await page.goto(url, {waitUntil: 'domcontentloaded', timeout: 60000});
          await page.waitForTimeout(8000);

          console.log('TITLE', await page.title());
          console.log('PLAYER', await page.locator('#movie_player').count());

          try {
            await page.locator('#movie_player').click({position:{x:640,y:360}, timeout:10000});
            await page.keyboard.press('Space');
          } catch (e) {
            console.log('PLAY_ACTION_ERROR', String(e));
          }

          await page.waitForTimeout(15000);

          const videoState = await page.evaluate(() => {
            const v = document.querySelector('video');
            return v ? {currentTime:v.currentTime, duration:v.duration, paused:v.paused, readyState:v.readyState, src:(v.src||'').slice(0,2000)} : null;
          });
          console.log('VIDEO_STATE', JSON.stringify(videoState));
          console.log('MEDIA_COUNT', media.size);
          for (const [k, v] of media) {
            console.log('MEDIA', JSON.stringify(v));
          }

          await page.screenshot({path:'browser-test/player.png', fullPage:false});
          await browser.close();

          if (!media.size) process.exit(2);
          EOF
          YOUTUBE_URL="$YOUTUBE_URL" node browser-test/inspect.mjs 2>&1 | tee browser-test/result.txt

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-media-test
          path: browser-test/
          retention-days: 3
