name: WPC YouTube Source Test
# Verified URL interpolation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Authorized YouTube video URL to test"
        required: true
        default: "https://youtu.be/5p-sq8v3OXw"
        type: string

env:
  YOUTUBE_URL: ${{ inputs.youtube_url || 'https://youtu.be/5p-sq8v3OXw' }}

jobs:
  test-wpc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chromium and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium ffmpeg file
          chromium --version
          ffmpeg -version | head -n 1

      - name: Install yt-dlp and WPC PO-token provider
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade yt-dlp yt-dlp-getpot-wpc
          yt-dlp --version
          yt-dlp -v --simulate "$YOUTUBE_URL" 2>&1 | tee wpc-diagnostic.txt || true
          grep -E "PO Token Providers|wpc-" wpc-diagnostic.txt || true

      - name: Download through WPC provider
        run: |
          set -Eeuo pipefail
          mkdir -p work/source
          CHROME="$(command -v chromium)"
          echo "Chrome: $CHROME"
          echo "Source: $YOUTUBE_URL"
          yt-dlp -v --no-playlist \
            --format "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]" \
            --merge-output-format mp4 \
            --extractor-args "youtubepot-wpc:browser_path=$CHROME" \
            --output "work/source/source.%(ext)s" \
            "$YOUTUBE_URL" 2>&1 | tee wpc-download.log

      - name: Validate source
        run: |
          set -Eeuo pipefail
          test -s work/source/source.mp4
          file work/source/source.mp4
          ffprobe -v error \
            -show_entries format=duration,size,format_name \
            -show_entries stream=width,height,codec_name \
            -of default=nw=1 work/source/source.mp4

      - name: Upload diagnostic/source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpc-source-test
          path: |
            wpc-diagnostic.txt
            wpc-download.log
            work/source/source.mp4
          if-no-files-found: warn
          retention-days: 3
