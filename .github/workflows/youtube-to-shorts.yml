name: YouTube to Shorts

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube video URL"
        required: true
        type: string
      clips:
        description: "Number of Shorts to create"
        required: true
        default: "4"
        type: string

jobs:
  youtube-to-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake build-essential python3 nodejs

      - name: Download source video
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
        run: |
          python3 -m pip install --user -U yt-dlp
          export PATH="$HOME/.local/bin:$PATH"
          yt-dlp --version
          mkdir -p work/source work/audio out
          if [[ "$YOUTUBE_URL" == http://*://* || "$YOUTUBE_URL" == https://* ]]; then
            if [[ "$YOUTUBE_URL" == *youtube.com/* || "$YOUTUBE_URL" == *youtu.be/* ]]; then
              yt-dlp \
                --no-playlist \
                --retries 3 \
                --fragment-retries 3 \
                --extractor-retries 3 \
                --socket-timeout 30 \
                --force-ipv4 \
                --js-runtimes node \
                --remote-components ejs:github \
                --format "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720][ext=mp4]/b[height<=720]" \
                --merge-output-format mp4 \
                --output "work/source/source.%(ext)s" \
                "$YOUTUBE_URL"
            else
              curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 30 \
                "$YOUTUBE_URL" -o work/source/source.mp4
            fi
          else
            echo "Invalid source URL"
            exit 1
          fi
          SOURCE="$(find work/source -maxdepth 1 -type f -name 'source.*' | head -n 1)"
          test -n "$SOURCE"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$SOURCE"

      - name: Build whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git work/whisper.cpp
          cmake -S work/whisper.cpp -B work/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build work/whisper.cpp/build --config Release -j 2
          bash work/whisper.cpp/models/download-ggml-model.sh base.en

      - name: Extract audio and transcribe
        run: |
          SOURCE="$(find work/source -maxdepth 1 -type f -name 'source.*' | head -n 1)"
          ffmpeg -y -i "$SOURCE" -vn -ac 1 -ar 16000 -c:a pcm_s16le work/audio/source.wav
          work/whisper.cpp/build/bin/whisper-cli \
            -m work/whisper.cpp/models/ggml-base.en.bin \
            -f work/audio/source.wav \
            -l en -ng -ml 1 \
            -osrt -ojf \
            -of work/audio/transcript
          test -s work/audio/transcript.srt
          test -s work/audio/transcript.json

      - name: Select and render Shorts
        env:
          CLIP_COUNT: ${{ inputs.clips }}
        run: |
          python3 scripts/youtube_to_shorts.py \
            --video "$(find work/source -maxdepth 1 -type f -name 'source.*' | head -n 1)" \
            --srt work/audio/transcript.srt \
            --count "$CLIP_COUNT" \
            --out out

      - name: Verify outputs
        run: |
          ls -lh out
          COUNT="$(find out -maxdepth 1 -type f -name 'short_*.mp4' | wc -l)"
          test "$COUNT" -ge 1
          for f in out/short_*.mp4; do
            echo "=== $f ==="
            ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name -of default=nw=1 "$f"
          done

      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts
          path: out/short_*.mp4
          if-no-files-found: error
          retention-days: 3
