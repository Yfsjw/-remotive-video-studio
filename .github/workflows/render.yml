name: Render MP4

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Render video
        run: npm run render
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: remotive-video-studio-30s-short
          path: out/main.mp4
          if-no-files-found: error
