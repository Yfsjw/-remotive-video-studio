name: Visual Story Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - visual-story-prototype-v1

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade pip
          python -m pip install piper-tts

      - name: Download curated visual assets
        run: |
          mkdir -p public/assets
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/9/93/Man_uses_laptop.jpg" -o public/assets/story-laptop.jpg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/1/11/PDC_server_room.jpg" -o public/assets/story-servers.jpg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/2/26/Computer_teacher.jpg" -o public/assets/story-teacher.jpg
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/e/ef/Programming_code.jpg" -o public/assets/story-code.jpg
          for f in public/assets/story-*.jpg; do
            test -s "$f"
            file "$f"
          done

      - name: Generate narration
        run: |
          mkdir -p public
          python -m piper.download_voices --data-dir public en_US-lessac-high
          printf '%s\n' "You type a question. It looks simple, but your request has to travel through a much bigger system." | python -m piper -m en_US-lessac-high --data-dir public -f s1.wav --length_scale 0.86
          printf '%s\n' "Servers receive it, process it, and move information between thousands of machines before anything comes back." | python -m piper -m en_US-lessac-high --data-dir public -f s2.wav --length_scale 0.86
          printf '%s\n' "But information alone is not enough. The viewer needs a path from the idea to the meaning." | python -m piper -m en_US-lessac-high --data-dir public -f s3.wav --length_scale 0.86
          printf '%s\n' "That is what good visual storytelling does. It makes the idea visible, and the result understandable." | python -m piper -m en_US-lessac-high --data-dir public -f s4.wav --length_scale 0.86
          ffmpeg -y -i s1.wav -i s2.wav -i s3.wav -i s4.wav -filter_complex "[0:a]apad=pad_dur=0.15,atrim=0:6[a0];[1:a]apad=pad_dur=0.15,atrim=0:6[a1];[2:a]apad=pad_dur=0.15,atrim=0:6[a2];[3:a]apad=pad_dur=0.15,atrim=0:6[a3];[a0][a1][a2][a3]concat=n=4:v=0:a=1,atrim=0:24[a]" -map "[a]" -ar 22050 -ac 1 public/voice.wav

      - name: Typecheck
        run: npm run check

      - name: Render video
        run: npm run render

      - name: Verify output
        run: |
          test -s out/main.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/main.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,codec_name -of default=nw=1 out/main.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate -of default=nw=1 out/main.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-story-prototype-v1
          path: |
            out/main.mp4
            public/assets/story-*.jpg
